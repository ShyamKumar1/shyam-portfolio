<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shyam OS — AI Engineer Portfolio</title>
  <meta name="description" content="AI Engineer building voice agents, TTS systems, and multi-agent architectures." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2300FF41'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='%23000' font-weight='bold'>S</text></svg>" />
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <link rel="stylesheet" href="/src/styles/boot.css" />
  <link rel="stylesheet" href="/src/styles/os.css" />
  <link rel="stylesheet" href="/src/styles/apps.css" />
</head>
<body>
  <div id="boot-screen" class="boot-screen">
    <div class="boot-logo">⚡</div>
    <div class="boot-name">SHYAM OS</div>
    <div class="boot-version">v1.0 — AI Engineer Edition</div>
    <div class="boot-bar-bg"><div class="boot-bar" id="boot-bar"></div></div>
    <div class="boot-status" id="boot-status">Initializing kernel...</div>
  </div>

  <div id="desktop" class="desktop hidden">
    <canvas id="wallpaper-canvas"></canvas>
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="window-container" class="window-container"></div>
    
    <div id="taskbar" class="taskbar">
      <button id="start-btn" class="taskbar-start">⏻ Start</button>
      <div id="taskbar-windows" class="taskbar-windows"></div>
      <div class="taskbar-tray">
        <span id="tray-battery">🔋 87%</span>
        <span id="tray-clock" class="tray-clock"></span>
      </div>
    </div>

    <div id="start-menu" class="start-menu hidden">
      <div class="start-header">SHYAM OS</div>
      <div class="start-items" id="start-items"></div>
      <div class="start-footer">
        <button id="start-about">👤 About</button>
        <button id="start-github">🐙 GitHub</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
